name: release-build-bundles

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to build and publish (optional)."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CUDA_VERSION: "12.8.0"
  RELEASE_VERSION: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build-linux:
    name: Linux ${{ matrix.label }}
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.8.0-devel-ubuntu22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: sm_61-dlto
            archs: "61"
            family: "GTX 10xx / Pascal"
            dlto: "ON"
            dlto_note: "enabled"
          - label: sm_75-dlto
            archs: "75"
            family: "RTX 20xx / Turing"
            dlto: "ON"
            dlto_note: "enabled"
          - label: sm_86-dlto
            archs: "86"
            family: "RTX 30xx / Ampere"
            dlto: "ON"
            dlto_note: "enabled"
          - label: sm_89-dlto
            archs: "89"
            family: "RTX 40xx / Ada"
            dlto: "ON"
            dlto_note: "enabled"
          - label: sm_120-dlto
            archs: "120"
            family: "RTX 50xx / Blackwell"
            dlto: "ON"
            dlto_note: "enabled"
          - label: universal-sm_86-sm_120
            archs: "86;89;120"
            family: "One binary for RTX 30xx / 40xx / 50xx"
            dlto: "OFF"
            dlto_note: "disabled"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y cmake ninja-build g++ make zip tar

      - name: Configure
        run: >-
          cmake --preset linux-release
          -D CMAKE_CUDA_ARCHITECTURES="${{ matrix.archs }}"
          -D CUDA_MNEMONIC_RECOVERY_ENABLE_DLTO=${{ matrix.dlto }}

      - name: Build
        run: cmake --build --preset linux-release

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          PKG_DIR="out/pkg/linux/${{ matrix.label }}"
          RELEASE_DIR="out/release"
          mkdir -p "$PKG_DIR"
          mkdir -p "$RELEASE_DIR"
          cp out/build/linux-release/bin/CUDA_Mnemonic_Recovery "$PKG_DIR/CUDA_Mnemonic_Recovery"
          cp README.md LICENSE.txt THIRD_PARTY_NOTICES.md RESPONSIBLE_USE.md SECURITY.md "$PKG_DIR/"
          cp -R examples "$PKG_DIR/examples"
          cat > "$PKG_DIR/BUILD.txt" <<EOF
          CUDA_Mnemonic_Recovery build profile
          Platform: Linux
          CUDA Toolkit: ${CUDA_VERSION}
          Architecture profile: ${{ matrix.label }}
          CUDA architectures: ${{ matrix.archs }}
          Intended hardware: ${{ matrix.family }}
          Driver requirement: a compatible NVIDIA driver is required on the target machine.
          Universal note: the universal sm_86-sm_120 bundle covers RTX 30xx through RTX 50xx. RTX 20xx uses the dedicated sm_75 build.
          EOF
          ARCHIVE="CUDA_Mnemonic_Recovery-${RELEASE_VERSION}-linux-${{ matrix.label }}.tar.gz"
          tar -C "$PKG_DIR" -czf "$RELEASE_DIR/$ARCHIVE" .
          sha256sum "$RELEASE_DIR/$ARCHIVE" > "$RELEASE_DIR/$ARCHIVE.sha256"

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.label }}
          path: out/release/*
          if-no-files-found: error

  build-windows:
    name: Windows ${{ matrix.label }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: sm_61
            archs: "61"
            family: "GTX 10xx / Pascal"
            dlto: "OFF"
            dlto_note: "disabled"
          - label: sm_75
            archs: "75"
            family: "RTX 20xx / Turing"
            dlto: "OFF"
            dlto_note: "disabled"
          - label: sm_86
            archs: "86"
            family: "RTX 30xx / Ampere"
            dlto: "OFF"
            dlto_note: "disabled"
          - label: sm_89
            archs: "89"
            family: "RTX 40xx / Ada"
            dlto: "OFF"
            dlto_note: "disabled"
          - label: sm_120
            archs: "120"
            family: "RTX 50xx / Blackwell"
            dlto: "OFF"
            dlto_note: "disabled"
          - label: universal-sm_86-sm_120
            archs: "86;89;120"
            family: "One binary for RTX 30xx / 40xx / 50xx"
            dlto: "OFF"
            dlto_note: "disabled"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: "12.8.0"
          method: "network"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure
        shell: powershell
        run: >-
          cmake --preset windows-release
          -D CMAKE_CUDA_ARCHITECTURES='${{ matrix.archs }}'
          -D CUDA_MNEMONIC_RECOVERY_ENABLE_DLTO=${{ matrix.dlto }}

      - name: Build
        shell: powershell
        run: cmake --build --preset windows-release --config Release -- /m:1

      - name: Package
        shell: powershell
        run: |
          $pkgDir = Join-Path $pwd "out/pkg/windows/${{ matrix.label }}"
          $releaseDir = Join-Path $pwd "out/release"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $binary = Get-ChildItem -Recurse (Join-Path $pwd "out/build/windows-release/bin") -Filter "CUDA_Mnemonic_Recovery.exe" | Select-Object -First 1
          if (-not $binary) { throw "Built executable not found." }
          Copy-Item $binary.FullName (Join-Path $pkgDir "CUDA_Mnemonic_Recovery.exe") -Force
          Copy-Item README.md, LICENSE.txt, THIRD_PARTY_NOTICES.md, RESPONSIBLE_USE.md, SECURITY.md $pkgDir -Force
          Copy-Item examples (Join-Path $pkgDir "examples") -Recurse -Force
          @"
          CUDA_Mnemonic_Recovery build profile
          Platform: Windows
          CUDA Toolkit: $env:CUDA_VERSION
          Architecture profile: ${{ matrix.label }}
          CUDA architectures: ${{ matrix.archs }}
          Intended hardware: ${{ matrix.family }}
          Driver requirement: a compatible NVIDIA driver is required on the target machine.
          Universal note: the universal sm_86-sm_120 bundle covers RTX 30xx through RTX 50xx. RTX 20xx uses the dedicated sm_75 build.
          "@ | Set-Content (Join-Path $pkgDir "BUILD.txt")
          $archive = "CUDA_Mnemonic_Recovery-$env:RELEASE_VERSION-windows-${{ matrix.label }}.zip"
          $archivePath = Join-Path $releaseDir $archive
          Compress-Archive -Path (Join-Path $pkgDir "*") -DestinationPath $archivePath -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archivePath).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content (Join-Path $releaseDir "$archive.sha256")

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.label }}
          path: out/release/*
          if-no-files-found: error

  bundle:
    name: Assemble release assets
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    steps:
      - name: Download Linux archives
        uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true

      - name: Download Windows archives
        uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: dist
          merge-multiple: true

      - name: Create aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt

      - name: Upload final archives
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: dist/*

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*
