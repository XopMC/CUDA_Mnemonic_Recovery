name: build-smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux ${{ matrix.label }}
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.8.0-devel-ubuntu22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: sm_61-dlto
            archs: "61"
            dlto: "ON"
          - label: sm_75-dlto
            archs: "75"
            dlto: "ON"
          - label: sm_86-dlto
            archs: "86"
            dlto: "ON"
          - label: sm_89-dlto
            archs: "89"
            dlto: "ON"
          - label: sm_120-dlto
            archs: "120"
            dlto: "ON"
          - label: universal-sm_86-sm_120
            archs: "86;89;120"
            dlto: "OFF"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y cmake ninja-build g++ make

      - name: Configure
        run: >-
          cmake --preset linux-release
          -D CMAKE_CUDA_ARCHITECTURES="${{ matrix.archs }}"
          -D CUDA_MNEMONIC_RECOVERY_ENABLE_DLTO=${{ matrix.dlto }}

      - name: Build
        run: cmake --build --preset linux-release

      - name: Check public help
        run: out/build/linux-release/bin/CUDA_Mnemonic_Recovery -help

  windows:
    name: Windows ${{ matrix.label }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: sm_61
            archs: "61"
            dlto: "OFF"
          - label: sm_75
            archs: "75"
            dlto: "OFF"
          - label: sm_86
            archs: "86"
            dlto: "OFF"
          - label: sm_89
            archs: "89"
            dlto: "OFF"
          - label: sm_120
            archs: "120"
            dlto: "OFF"
          - label: universal-sm_86-sm_120
            archs: "86;89;120"
            dlto: "OFF"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: "12.8.0"
          method: "network"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure
        shell: powershell
        run: >-
          cmake --preset windows-release
          -D CMAKE_CUDA_ARCHITECTURES='${{ matrix.archs }}'
          -D CUDA_MNEMONIC_RECOVERY_ENABLE_DLTO=${{ matrix.dlto }}

      - name: Build
        shell: powershell
        run: cmake --build --preset windows-release --config Release -- /m:1

      - name: Check public help
        shell: powershell
        run: |
          $binary = Get-ChildItem -Recurse (Join-Path $pwd "out/build/windows-release/bin") -Filter "CUDA_Mnemonic_Recovery.exe" | Select-Object -First 1
          if (-not $binary) { throw "Built executable not found." }
          & $binary.FullName -help
